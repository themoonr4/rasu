<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="System Health Check - Monitor database, storage, and performance">
    <meta name="theme-color" content="#dc2626">
    <title>THE MOON - System Health</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;padding:2rem;}
        .container{max-width:800px;margin:0 auto;}
        h1{margin-bottom:2rem;color:#dc2626;}
        .health-card{background:#111;border:1px solid #222;border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
        .health-status{display:flex;align-items:center;gap:1rem;margin:1rem 0;padding:0.75rem;background:#1a1a1a;border-radius:8px;}
        .status-badge{width:12px;height:12px;border-radius:50%;animation:pulse 2s infinite;}
        .status-badge.green{background:#28a745;box-shadow:0 0 10px #28a745;}
        .status-badge.red{background:#dc3545;box-shadow:0 0 10px #dc3545;}
        .status-badge.yellow{background:#ffc107;box-shadow:0 0 10px #ffc107;}
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }
        .back-btn{display:inline-flex;align-items:center;gap:0.5rem;background:transparent;border:1px solid #333;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;cursor:pointer;transition:0.3s;}
        .back-btn:hover{border-color:#555;}
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="location.href='admin.html'"><i class="fas fa-arrow-left"></i> Back</button>
        <h1><i class="fas fa-heartbeat"></i> System Health Check</h1>
        
        <div class="health-card" id="supabaseStatus">
            <h3><i class="fas fa-database"></i> Supabase Connection</h3>
            <div class="health-status"><div class="status-badge yellow"></div> Checking...</div>
        </div>
        
        <div class="health-card" id="storageStatus">
            <h3><i class="fas fa-hdd"></i> Storage Usage</h3>
            <div class="health-status"><div class="status-badge yellow"></div> Checking...</div>
        </div>
        
        <div class="health-card">
            <h3><i class="fas fa-chart-line"></i> Last 24 Hours Analytics</h3>
            <div class="health-status" id="statsHealth"><div class="status-badge yellow"></div> Checking...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zpubhlbdqwzyseditrls.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4YiRI2c1Tij-2KvyNtJ9Sg_8-l0OFuP';
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        async function checkHealth() {
            try {
                const { data, error } = await supabase.from('news').select('count', { count: 'exact', head: true });
                if(error) throw error;
                document.querySelector('#supabaseStatus .health-status').innerHTML = '<div class="status-badge green" style=""></div> <span>✅ Connected - Database online</span>';
            } catch(e) {
                document.querySelector('#supabaseStatus .health-status').innerHTML = '<div class="status-badge red"></div> <span>❌ Connection failed - ' + e.message + '</span>';
            }
            
            const used = JSON.parse(localStorage.getItem('backups') || '[]').length;
            const storageMB = (used * 0.5).toFixed(1);
            const storagePercent = ((used / 100) * 100).toFixed(1);
            document.querySelector('#storageStatus .health-status').innerHTML = `<div class="status-badge green"></div> <span>📦 ${used} backups | ~${storageMB} MB used (${storagePercent}%)</span>`;
            
            try {
                const { data: lastDay } = await supabase.from('news').select('views').gte('published_at', new Date(Date.now() - 86400000).toISOString());
                const viewsCount = lastDay?.reduce((a,b) => a + (b.views || 0), 0) || 0;
                document.getElementById('statsHealth').innerHTML = `<div class="status-badge green"></div> <span>👁️ ${viewsCount} views in last 24 hours</span>`;
            } catch(e) {
                document.getElementById('statsHealth').innerHTML = `<div class="status-badge yellow"></div> <span>⚠️ Could not fetch analytics</span>`;
            }
        }
        
        checkHealth();
        setInterval(checkHealth, 30000); // Refresh every 30 seconds
        if (localStorage.getItem('theme') === 'light') document.body.setAttribute('data-theme', 'light');
    </script>
</body>
</html>
